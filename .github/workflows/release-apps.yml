name: Release apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PUBLIC_WEBSITE_URL: ${{ vars.PUBLIC_WEBSITE_URL }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_BASE_URL="$APP_BASE_URL" \
            --dart-define=PUBLIC_WEBSITE_URL="$PUBLIC_WEBSITE_URL"

      - run: cp deploy/flutter-web-vercel.json build/web/vercel.json

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web
          retention-days: 7

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PUBLIC_WEBSITE_URL: ${{ vars.PUBLIC_WEBSITE_URL }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_BASE_URL="$APP_BASE_URL" \
            --dart-define=PUBLIC_WEBSITE_URL="$PUBLIC_WEBSITE_URL"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "school-management-${{ needs.prepare.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: school-management-${{ needs.prepare.outputs.version }}-android.apk
          retention-days: 7

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PUBLIC_WEBSITE_URL: ${{ vars.PUBLIC_WEBSITE_URL }}
        run: |
          flutter pub get
          flutter build windows --release `
            --dart-define=SUPABASE_URL="$env:SUPABASE_URL" `
            --dart-define=SUPABASE_ANON_KEY="$env:SUPABASE_ANON_KEY" `
            --dart-define=APP_BASE_URL="$env:APP_BASE_URL" `
            --dart-define=PUBLIC_WEBSITE_URL="$env:PUBLIC_WEBSITE_URL"

      - name: Zip Windows release
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $src = "build\windows\x64\runner\Release"
          $zip = "school-management-$ver-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: school-management-${{ needs.prepare.outputs.version }}-windows.zip
          retention-days: 7

  publish:
    needs: [prepare, build-web, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: School Management ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist/school-management-${{ needs.prepare.outputs.version }}-windows.zip
            dist/school-management-${{ needs.prepare.outputs.version }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Supabase download links
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          SCHOOL_ID: ${{ vars.SCHOOL_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          WIN="https://github.com/${REPO}/releases/download/${TAG}/school-management-${VERSION}-windows.zip"
          APK="https://github.com/${REPO}/releases/download/${TAG}/school-management-${VERSION}-android.apk"
          node scripts/update-portal-releases.mjs "$VERSION" "$WIN" "$APK" "$APP_BASE_URL"

  deploy-flutter-web:
    needs: [prepare, build-web]
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_FLUTTER_PROJECT_ID != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: build/web

      - name: Deploy Flutter web to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_FLUTTER_PROJECT_ID }}
          working-directory: build/web
          vercel-args: "--prod"
